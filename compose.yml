services:
  tea-urls:
    container_name: tea-urls
    build: .
    environment:
      DATABASE_URL: postgres://user:123@db:5432/links?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: db
    image: postgres:18.6
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: links
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d links"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period:  10s

volumes:
  postgres_data: