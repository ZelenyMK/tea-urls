services:
  tea-urls:
    container_name: tea-urls
    build: .
    environment:
      DATABASE_URL: postgres://tea_app:${POSTGRES_PASSWORD}@db:5432/links?sslmode=disable
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  db:
    container_name: db
    image: postgres:18.6
    environment:
      POSTGRES_USER: tea_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: links
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tea_app -d links"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period:  10s
  
  redis:
    container_name: redis
    image: redis
    ports:
      - "127.0.0.1:6379:6379"


volumes:
  postgres_data:
  